- job_name: nifi-red
  scheme: https
  metrics_path: /nifi-api/flow/metrics/prometheus
  scrape_interval: 30s
  tls_config:
    ca_file:   /etc/prometheus/nifi-tls/ca.crt
    cert_file: /etc/prometheus/nifi-tls/tls.crt
    key_file:  /etc/prometheus/nifi-tls/tls.key
    server_name: nifi-red.inspire-silrelease.svc.cluster.local
  static_configs:
    - targets: ['nifi-red.inspire-silrelease.svc.cluster.local:8443']
      labels: { nifi_instance: nifi-red, domain: red }




  kubectl get deploy -A | grep prometheus
  kubectl -n <prom-ns> get deploy prometheus -o jsonpath='{.spec.template.spec.containers[*].name}'




  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: prometheus
  spec:
    template:
      spec:
        containers:
          - name: prometheus              # name from step 1
            volumeMounts:
              - name: nifi-tls
                mountPath: /etc/prometheus/nifi-tls
                readOnly: true
        volumes:
          - name: nifi-tls
            secret:
              secretName: nifi-scrape-tls
              defaultMode: 0440
