apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nifi
  labels:
    release: <prometheus-release-label>          # must match Prometheus serviceMonitorSelector
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app: nifi                                   # labels on the NiFi Service (patched per side)
  endpoints:
    - port: https                                 # port NAME of 8443 in the NiFi Service
      scheme: https
      path: /nifi-api/flow/metrics/prometheus
      interval: 30s
      tlsConfig:
        ca:   { secret: { name: nifi-scrape-tls, key: ca.crt } }
        cert: { secret: { name: nifi-scrape-tls, key: tls.crt } }
        keySecret: { name: nifi-scrape-tls, key: tls.key }
        serverName: nifi.example                  # patched per side





apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nifi
spec:
  selector:
    matchLabels:
      app: nifi-red                               # real label of the nifi-red Service
  endpoints:
    - port: https
      scheme: https
      path: /nifi-api/flow/metrics/prometheus
      interval: 30s
      tlsConfig:
        ca:   { secret: { name: nifi-scrape-tls, key: ca.crt } }
        cert: { secret: { name: nifi-scrape-tls, key: tls.crt } }
        keySecret: { name: nifi-scrape-tls, key: tls.key }
        serverName: nifi-red.inspire-silrelease.svc.cluster.local




resources:
  - nifi-scrape-tls.yaml
patches:
  - path: servicemonitor-patch.yaml



# 1. Service label and port name (fill into the patch)
  kubectl -n inspire-silrelease get svc nifi-red -o yaml | grep -A5 -E "labels:|ports:"
  
  # 2. Label Prometheus uses to pick ServiceMonitors
  kubectl get prometheus -A -o jsonpath='{.items[*].spec.serviceMonitorSelector}'
  
  # 3. Prometheus is allowed to watch the NiFi namespace ({} = all namespaces)
  kubectl get prometheus -A -o jsonpath='{.items[*].spec.serviceMonitorNamespaceSelector}'
  
  # 4. ServiceMonitor CRD exists on BOTH clusters
  kubectl get crd servicemonitors.monitoring.coreos.com
