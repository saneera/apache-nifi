            description: An address book entry UUID
            optional: false
            minLength: null
            maxLength: null
            regex: null
            initialValue: null
          initialValue: null
      initialValue: null
    result:
      type: string
      name: conferenceComposeResult
      description: UUID of created conference
      optional: false
      minLength: null
      maxLength: null
      regex: null
      initialValue: null
  conference-delete:
    args:
      type: object
      name: conference delete
      description: Conference delete
      optional: false
      properties:
        conferenceId:
          type: string
          name: conferenceId
          description: Conference ID
          optional: false
          minLength: null
          maxLength: null
          regex: null
          initialValue: null
      initialValue: null
    result: null

circuitOperations:
  conference-compose:
    name: Conference compose
    description: Create a new empty conference
    schedule: null
    fragmentOperations:
      pbx-enmf:
        pbx:
          - port: null
            command: conference-compose
            parameters:
              targets: []
  conference-delete:
    name: Delete conference call
    description: Destroy a conference call
    schedule: null
    fragmentOperations:
      pbx-enmf:
        pbx:
          - port: null
            command: conference-delete
            parameters:
              conferenceId: $conference-compose.result.result.body.conferenceId
  add-operator:
    name: Add operator to a conference call.
    description: Add operator to a conference call.
    schedule: null
    fragmentOperations:
      enmf:
        headset:
          - port: null
            command: conference-compose
            parameters:
              conferenceId: conference-compose.result.result.body.conferenceId   # no "$" in source
              targets:
                - $USER_ADDRESSBOOK_ID
  delete-operator:
    name: Remove operator from a conference call.
    description: Remove operator from a conference call.
    schedule: null
    fragmentOperations:
      enmf:
        headset:
          - port: null
            command: conference-delete
            parameters:
              conferenceId: $conference-compose.result.result.body.conferenceId

