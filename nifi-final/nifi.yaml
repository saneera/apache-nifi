apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
  namespace: nifi
spec:
  serviceName: nifi-headless
  replicas: 1
  selector:
    matchLabels:
      app: nifi
  template:
    metadata:
      labels:
        app: nifi
    spec:
      setHostnameAsFQDN: true
      containers:
        - name: nifi
          image: apache/nifi:2.7.2
          ports:
            - name: https
              containerPort: 8443
            - name: cluster
              containerPort: 11443

          envFrom:
            - configMapRef:
                name: nifi-env
            - secretRef:
                name: nifi-auth


          volumeMounts:

            # ✅ Mount PVC into repo folders (DO NOT mount over /opt/nifi/nifi-current)
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/flowfile_repository
              subPath: flowfile_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/content_repository
              subPath: content_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/provenance_repository
              subPath: provenance_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/state
              subPath: state
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/database_repository
              subPath: database_repository
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/logs
              subPath: logs


      volumes:

        - name: nifi-tls-bundle
          secret:
            secretName: nifi-tls-bundle

        # ✅ NEW: writable runtime cert location
        - name: runtime-certs
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: nifi-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 3Gi
        # storageClassName: YOUR_STORAGE_CLASS

