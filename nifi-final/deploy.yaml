apiVersion: v1
kind: Namespace
metadata:
  name: nifi

---
apiVersion: v1
kind: Service
metadata:
  name: nifi-headless
  namespace: nifi
spec:
  clusterIP: None
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: 8443
    - name: cluster
      port: 11443
      targetPort: 11443
---
apiVersion: v1
kind: Service
metadata:
  name: nifi
  namespace: nifi
spec:
  type: NodePort
  selector:
    app: nifi
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      nodePort: 30443   # change if needed
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-env
  namespace: nifi
data:
  # Basic
  NIFI_WEB_HTTPS_PORT: "8443"
  NIFI_CLUSTER_IS_NODE: "false"
  NIFI_CLUSTER_NODE_PROTOCOL_PORT: "11443"

  # Optional but recommended in many setups
  NIFI_SENSITIVE_PROPS_KEY: "ChangeMe_32chars_minimum_please!!"

  # If you access NiFi via NodePort using node IP, you typically need proxy host set:
  # example: "10.0.0.10:30443"
  # You can also add multiple entries comma-separated.
  NIFI_WEB_PROXY_HOST: "localhost:30443"
---



---

apiVersion: v1
kind: Secret
metadata:
  name: nifi-tls
  namespace: nifi
type: Opaque
data:
  ca.crt: 
  truststore.p12: 


---

apiVersion: v1
kind: Secret
metadata:
  name: nifi-auth
  namespace: nifi
type: Opaque
stringData:
  SINGLE_USER_CREDENTIALS_USERNAME: admin
  SINGLE_USER_CREDENTIALS_PASSWORD: admin123456!
