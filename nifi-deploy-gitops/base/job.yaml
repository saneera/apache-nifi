# Runs deploy.sh once per Argo CD sync.
#
# PostSync hook: runs AFTER the ConfigMaps (script, flows, env) in the same sync are applied and healthy.
# BeforeHookCreation: the previous run's Job (and its pod logs) are kept until the next sync replaces them.
apiVersion: batch/v1
kind: Job
metadata:
  name: nifi-deploy
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0                  # a failed deploy fails visibly; no silent retries against NiFi
  activeDeadlineSeconds: 3600      # hard stop after 1 hour
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nifi-deploy
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false   # the script only talks to NiFi/Registry, never to Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deploy
          image: nifi-deploy-runner           # set per overlay via `images:` (needs bash, curl, jq)
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "/scripts/deploy.sh"]
          envFrom:
            - configMapRef:
                name: nifi-deploy-env         # generated per overlay from deploy.env + params.env
          env:
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nifi-single-user      # existing Secret — not stored in Git
                  key: username
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nifi-single-user
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: flows
              mountPath: /flows
              readOnly: true
            - name: tmp
              mountPath: /tmp                 # the script writes prepared flows to /tmp
      volumes:
        - name: scripts
          configMap:
            name: nifi-deploy-script
        - name: flows
          # One ConfigMap per flow file, all projected into /flows.
          # The list of sources is set in each overlay (flows.yaml).
          projected:
            sources: []
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
