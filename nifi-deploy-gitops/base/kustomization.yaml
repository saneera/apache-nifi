apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - job.yaml

# The script lives in Git as a plain .sh file and becomes its own ConfigMap.
# The generated name gets a content hash, so editing deploy.sh always gives the Job a fresh ConfigMap.
configMapGenerator:
  - name: nifi-deploy-script
    files:
      - scripts/deploy.sh

labels:
  - pairs:
      app.kubernetes.io/part-of: nifi-deploy
    includeSelectors: false
