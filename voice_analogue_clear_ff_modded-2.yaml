circuitProperties:
  conference-compose:
    args:
      type: object
      name: Conference compose
      description: Create a new empty conference
      optional: false
      properties:
        conferenceId:
          type: string
          name: conferenceId
          description: Conference Id
          optional: false
        targets:
          type: array
          name: targets
          description: List of address book entry UUIDs
          optional: false
          items:
            type: string
            name: target
            description: An address book entry UUID
            optional: false
    result:
      type: string
      name: conferenceComposeResult
      description: UUID of created conference
      optional: false
  conference-delete:
    args:
      type: object
      name: conference delete
      description: Conference delete
      optional: false
      properties:
        conferenceId:
          type: string
          name: conferenceId
          description: Conference ID
          optional: false
circuitOperations:
  conference-compose:
    name: Conference compose
    description: Create a new empty conference
    fragmentOperations:
      pbx-enmf:
        pbx:
          - command: conference-compose
            parameters:
              targets: []
  conference-delete:
    name: Delete conference call
    description: Destroy a conference call
    fragmentOperations:
      pbx-enmf:
        pbx:
          - command: conference-delete
            parameters:
              conferenceId: $conference-compose.result.result.body.conferenceId
  add-operator:
    name: Add operator to a conference call.
    description: Add operator to a conference call.
    fragmentOperations:
      enmf:
        headset:
          - command: conference-compose
            parameters:
              conferenceId: conference-compose.result.result.body.conferenceId
              targets:
                - $USER_ADDRESSBOOK_ID
  delete-operator:
    name: Remove operator from a conference call.
    description: Remove operator from a conference call.
    fragmentOperations:
      enmf:
        headset:
          - command: conference-delete
            parameters:
              conferenceId: $conference-compose.result.result.body.conferenceId
circuitAlarms: {}
alarmMapping: {}
