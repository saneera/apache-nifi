# GENERATED by flow-deployer/tools/sync-flows.sh — do not edit by hand. Re-run it after changing flow files.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# One ConfigMap per flow file.
configMapGenerator:
  - name: flow-deploy-flow-circuit-manager
    files:
      - Circuit-Manager-version-1.json
  - name: flow-deploy-flow-property-service-publisher
    files:
      - Property-Service-Publisher-version-1.json

generatorOptions:
  disableNameSuffixHash: true

# Project every flow ConfigMap into /flows in the deployer Job.
patches:
  - target:
      kind: Job
      name: flow-deploy-job
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: flow-deploy-job
      spec:
        template:
          spec:
            volumes:
              - name: flows
                projected:
                  sources:
                    - configMap:
                        name: flow-deploy-flow-circuit-manager
                    - configMap:
                        name: flow-deploy-flow-property-service-publisher

