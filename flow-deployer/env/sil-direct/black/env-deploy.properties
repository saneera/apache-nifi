# nifi flow deployer properties — BLACK (sil-direct)
# COPY the values from your current env/sil-direct/black/env-deploy.properties
NIFI_URL=https://CHANGE-ME:CHANGE-ME-port

REGISTRY_ID=CHANGE-ME-registry-client-id
# Bucket: give the id, OR leave REGISTRY_BUCKET_ID out and set BUCKET_NAME (found or created automatically)
REGISTRY_BUCKET_ID=CHANGE-ME-bucket-id
# BUCKET_NAME=hfc2-flows
REGISTRY_URL=http://CHANGE-ME:30099

TARGET_RPG_URL=https://CHANGE-ME:CHANGE-ME-port
# PARAM_<nifi-parameter-name>=<value> — applied to the flow's own parameter context (non-sensitive only).
# Changing only a PARAM_ value updates the context without creating a new flow version.
PARAM_mq-exchange-name=CHANGE-ME

START_FLOW=true
