read-message:
  description: Read Message from the given room
  arguments:
    roomName:
      name: roomName
      description: Room name to retrieve message.
      type: PropertyString
    participantName:
      name: participantName
      description: Participant Name.
      type: PropertyString
  result:
    type: PropertyObject
    name: data
    properties:
      roomName:
        name: roomName
        type: PropertyString
        description: Room name
      participantName:
        name: participantName
        type: PropertyString
        description: Participant Name
      messageId:
        name: messageId          # ← fix name (was "message")
        type: PropertyString
        description: Message ID
      messages:                  # ← ADD — list of messages
        name: messages
        type: PropertyArray
        description: List of retrieved messages
        items:
          type: PropertyObject
          name: messageResponse
          properties:
            messageId:
              name: messageId
              type: PropertyString
              description: Message ID
            sender:
              name: sender
              type: PropertyString
              description: Sender name
            message:
              name: message
              type: PropertyString
              description: Message body
            roomName:
              name: roomName
              type: PropertyString
              description: Room name
            timestamp:
              name: timestamp
              type: PropertyString
              description: Original message timestamp
            isDelayed:
              name: isDelayed
              type: PropertyBoolean
              description: True if message is from history





    messageIds:                  # ← ADD — optional
      name: messageIds
      type: PropertyArray
      description: List of message IDs to retrieve. Empty = all messages.
      items:
        type: PropertyString
        name: messageId
