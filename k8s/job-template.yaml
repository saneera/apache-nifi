# Template for every deployment Job. Replace with your current NiFi deploy Job manifest.
# Flow Deployer will:
#   - set metadata.name (unique per run) and add labels/annotations
#   - add/override these env vars on the FIRST container:
#       NIFI_URL REGISTRY_URL TARGET_RPG_URL REGISTRY_ID REGISTRY_BUCKET_ID BUCKET_NAME
#       FLOWS START_FLOW POSITION_STEP DEPLOY_COMMENT PARAM_OVERRIDES PROGRESS_MARKERS
#   - set ttlSecondsAfterFinished
# Keep credentials here as secretKeyRef (they never pass through the wizard).
apiVersion: batch/v1
kind: Job
metadata:
  name: nifi-deploy-template
spec:
  backoffLimit: 0                 # a failed deploy should fail visibly, not silently retry
  template:
    metadata:
      labels:
        app: nifi-deploy
    spec:
      restartPolicy: Never
      containers:
        - name: deploy
          image: your-registry.local/nifi-deploy-script:latest   # <- your existing image
          command: ["/bin/bash", "/scripts/deploy.sh"]
          env:
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              valueFrom:
                secretKeyRef: { name: nifi-single-user, key: username }
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              valueFrom:
                secretKeyRef: { name: nifi-single-user, key: password }
          volumeMounts:
            - name: flows
              mountPath: /flows
              readOnly: true
      volumes:
        - name: flows
          persistentVolumeClaim:
            claimName: nifi-flows       # <- same source the deployer reads (could be a ConfigMap)
