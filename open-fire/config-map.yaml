apiVersion: v1
kind: ConfigMap
metadata:
  name: openfire-xml-config
  namespace: <your-namespace>
data:
  openfire.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <jive>
        <adminConsole>
            <!-- Disable either port by setting the value to -1 -->
            <port>9090</port>
            <securePort>9091</securePort>
        </adminConsole>
        <locale>en</locale>
        <!-- Network settings. By default, Openfire will bind to all network interfaces.
             Alternatively, you can specify a specific network interfaces that the server
             will listen on. For example, 127.0.0.1. This setting is generally only useful
             on multi-homed servers. -->
        <network>
            <interface></interface>
        </network>
        <!--
        One time token to gain temporary access to the admin console.
        <oneTimeAccessToken>secretToken</oneTimeAccessToken>
        -->
        <connectionProvider>
            <className>org.jivesoftware.database.DefaultConnectionProvider</className>
        </connectionProvider>
        <database>
          <defaultProvider>
          <driver>com.mysql.cj.jdbc.Driver</driver>
          <serverURL>jdbc:mysql://10.11.253.93:30306/openfire?rewriteBatchedStatements=true&amp;characterEncoding=UTF-8&amp;characterSetResults=UTF-8</serverURL>
          <username>your_actual_db_username</username>
          <password>your_actual_db_password</password>
          <testSQL>select 1</testSQL>
          <testBeforeUse>false</testBeforeUse>
          <testAfterUse>false</testAfterUse>
          <testTimeout>PT0.5S</testTimeout>
          <timeBetweenEvictionRuns>PT30S</timeBetweenEvictionRuns>
          <minIdleTime>PT15M</minIdleTime>
          <maxWaitTime>PT0.5S</maxWaitTime>
          <minConnections>5</minConnections>
          <maxConnections>25</maxConnections>
          <connectionTimeout>1.0</connectionTimeout>
          </defaultProvider>
          </database>
        <setup>true</setup>
        <fqdn>openfire-xmpp-dev1</fqdn>
    </jive>

      
