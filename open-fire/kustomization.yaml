# base/kustomization.yaml
resources:
  - deploy.yaml
  -
---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nifi-logback
    data:
      logback.xml: |
        <?xml version="1.0" encoding="UTF-8"?>
        <configuration scan="true" scanPeriod="30 seconds">

          <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
              <pattern>%d{yyyy-MM-dd HH:mm:ss,SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
            </encoder>
          </appender>

          <!-- NiFi default file appender usually exists; keep it if your image already has it.
               If not, this adds a simple rolling file appender. -->
          <appender name="APP_FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <file>/opt/nifi/nifi-current/logs/nifi-app.log</file>
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
              <fileNamePattern>/opt/nifi/nifi-current/logs/nifi-app.%d{yyyy-MM-dd}.%i.log.gz</fileNamePattern>
              <maxFileSize>50MB</maxFileSize>
              <maxHistory>14</maxHistory>
              <totalSizeCap>2GB</totalSizeCap>
            </rollingPolicy>
            <encoder>
              <pattern>%d{yyyy-MM-dd HH:mm:ss,SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
            </encoder>
          </appender>

          <!-- Targeted debug (recommended) -->
          <logger name="org.apache.nifi.web" level="DEBUG"/>
          <logger name="org.apache.nifi.processors" level="DEBUG"/>

          <root level="INFO">
            <appender-ref ref="APP_FILE"/>
            <appender-ref ref="STDOUT"/>
          </root>

        </configuration>


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-users
data:
  users.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <tenants>
        <groups></groups>
        <users>
            <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55" identity="admin"/>
        </users>
    </tenants>
      

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-authorizations
data:
  authorizations.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <authorizations>
        <policies>
            
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a01" resource="/flow" action="R">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a02" resource="/flow" action="W">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a03" resource="/flow" action="O">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
            
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a11" resource="/tenants" action="R">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a12" resource="/tenants" action="W">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
            
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a21" resource="/policies" action="R">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
            <policy identifier="c1a7a2f1-2d8c-4c1a-8f5a-8b5e3d9e1a22" resource="/policies" action="W">
                <user identifier="9f3c2b77-6e45-4f7b-9c8d-6b0d9a7d8e55"/>
            </policy>
        
        </policies>
    </authorizations>
      

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-authorizers
data:
  authorizers.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <authorizers>

        <userGroupProvider>
            <identifier>file-user-group-provider</identifier>
            <class>org.apache.nifi.authorization.FileUserGroupProvider</class>
            <property name="Users File">./conf/users.xml</property>
            <property name="Legacy Authorized Users File"></property>
        </userGroupProvider>

        <accessPolicyProvider>
            <identifier>file-access-policy-provider</identifier>
            <class>org.apache.nifi.authorization.FileAccessPolicyProvider</class>
            <property name="User Group Provider">file-user-group-provider</property>
            <property name="Authorizations File">./conf/authorizations.xml</property>

            <!-- MUST MATCH LOGIN USERNAME -->
            <property name="Initial Admin Identity">admin</property>
        </accessPolicyProvider>

        <authorizer>
            <identifier>managed-authorizer</identifier>
            <class>org.apache.nifi.authorization.StandardManagedAuthorizer</class>
            <property name="Access Policy Provider">file-access-policy-provider</property>
        </authorizer>

    </authorizers>
  ---

volumeMounts:
  - name: nifi-users
    mountPath: /opt/nifi/nifi-current/conf/users.xml
    subPath: users.xml

  - name: nifi-authorizations
    mountPath: /opt/nifi/nifi-current/conf/authorizations.xml
    subPath: authorizations.xml

---

volumes:
  - name: nifi-users
    configMap:
      name: nifi-users

  - name: nifi-authorizations
    configMap:
      name: nifi-authorizations




volumes:
  - name: nifi-authorizers
    configMap:
      name: nifi-authorizers


volumeMounts:
  - name: nifi-authorizers
    mountPath: /opt/nifi/nifi-current/conf/authorizers.xml
    subPath: authorizers.xml
