# base/kustomization.yaml
resources:
  - deploy.yaml
  -
---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: nifi-logback
    data:
      logback.xml: |
        <?xml version="1.0" encoding="UTF-8"?>
        <configuration scan="true" scanPeriod="30 seconds">

          <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
            <encoder>
              <pattern>%d{yyyy-MM-dd HH:mm:ss,SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
            </encoder>
          </appender>

          <!-- NiFi default file appender usually exists; keep it if your image already has it.
               If not, this adds a simple rolling file appender. -->
          <appender name="APP_FILE" class="ch.qos.logback.core.rolling.RollingFileAppender">
            <file>/opt/nifi/nifi-current/logs/nifi-app.log</file>
            <rollingPolicy class="ch.qos.logback.core.rolling.SizeAndTimeBasedRollingPolicy">
              <fileNamePattern>/opt/nifi/nifi-current/logs/nifi-app.%d{yyyy-MM-dd}.%i.log.gz</fileNamePattern>
              <maxFileSize>50MB</maxFileSize>
              <maxHistory>14</maxHistory>
              <totalSizeCap>2GB</totalSizeCap>
            </rollingPolicy>
            <encoder>
              <pattern>%d{yyyy-MM-dd HH:mm:ss,SSS} [%thread] %-5level %logger{36} - %msg%n</pattern>
            </encoder>
          </appender>

          <!-- Targeted debug (recommended) -->
          <logger name="org.apache.nifi.web" level="DEBUG"/>
          <logger name="org.apache.nifi.processors" level="DEBUG"/>

          <root level="INFO">
            <appender-ref ref="APP_FILE"/>
            <appender-ref ref="STDOUT"/>
          </root>

        </configuration>


---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-users
data:
  users.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <tenants>
        <users>
            <user identifier="admin-user-uuid" identity="admin"/>
        </users>
        <groups/>
    </tenants>
      

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-authorizations
data:
  authorizations.xml: |
    <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
    <authorizations>

        <policies>

            <!-- Full admin access -->
            <policy identifier="admin-policy-uuid" resource="/flow" action="R">
                <user identifier="admin-user-uuid"/>
            </policy>

            <policy identifier="admin-policy-write-uuid" resource="/flow" action="W">
                <user identifier="admin-user-uuid"/>
            </policy>

            <policy identifier="admin-policy-operate-uuid" resource="/flow" action="O">
                <user identifier="admin-user-uuid"/>
            </policy>

            <!-- Access to policies UI -->
            <policy identifier="policy-read-uuid" resource="/policies" action="R">
                <user identifier="admin-user-uuid"/>
            </policy>

            <policy identifier="policy-write-uuid" resource="/policies" action="W">
                <user identifier="admin-user-uuid"/>
            </policy>

            <!-- Access to tenants UI -->
            <policy identifier="tenants-read-uuid" resource="/tenants" action="R">
                <user identifier="admin-user-uuid"/>
            </policy>

            <policy identifier="tenants-write-uuid" resource="/tenants" action="W">
                <user identifier="admin-user-uuid"/>
            </policy>

        </policies>

    </authorizations>

  ---

volumeMounts:
  - name: nifi-users
    mountPath: /opt/nifi/nifi-current/conf/users.xml
    subPath: users.xml

  - name: nifi-authorizations
    mountPath: /opt/nifi/nifi-current/conf/authorizations.xml
    subPath: authorizations.xml

---

volumeMounts:
  - name: nifi-users
    mountPath: /opt/nifi/nifi-current/conf/users.xml
    subPath: users.xml

  - name: nifi-authorizations
    mountPath: /opt/nifi/nifi-current/conf/authorizations.xml
    subPath: authorizations.xml
