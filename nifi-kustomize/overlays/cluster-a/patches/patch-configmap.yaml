apiVersion: v1
kind: ConfigMap
metadata:
  name: nifi-config
data:
  nifi.properties: |
    # Web
    nifi.web.https.port=8443
    nifi.web.https.host=0.0.0.0
    nifi.web.http.port=

    # Site to Site
    nifi.remote.input.secure=true
    nifi.remote.input.socket.port=10000
    nifi.remote.input.http.enabled=true
    nifi.remote.input.host=172.27.3.23

    # TLS
    nifi.security.keystore=/opt/nifi/certs/keystore.p12
    nifi.security.keystoreType=PKCS12
    nifi.security.keystorePasswd=th1s1s3up34e5r37
    nifi.security.keyPasswd=th1s1s3up34e5r37
    nifi.security.truststore=/opt/nifi/certs/truststore.p12
    nifi.security.truststoreType=PKCS12
    nifi.security.truststorePasswd=th1s1s3up34e5r37

    # Cluster
    nifi.cluster.is.node=false

    # Repositories
    nifi.flowfile.repository.directory=./flowfile_repository
    nifi.content.repository.directory.default=./content_repository
    nifi.provenance.repository.directory.default=./provenance_repository
    nifi.database.directory=./database_repository
