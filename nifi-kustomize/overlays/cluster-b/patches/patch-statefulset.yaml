apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nifi
spec:
  template:
    spec:
      containers:
        - name: nifi
          env:
            - name: NIFI_WEB_HTTPS_HOST
              value: "nifi-black-0.nifi-black-headless.inspire-silrelease.svc.cluster.local"
            - name: NIFI_REMOTE_INPUT_HOST
              value: "172.27.3.12"
      volumes:
        - name: nifi-certs
          secret:
            secretName: nifi-black-certs
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - cluster-b-node-1    # ← update to your actual node name
