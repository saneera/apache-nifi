apiVersion: v1
kind: Service
metadata:
  name: nifi-nodeport
  namespace: inspire-silrelease
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: NodePort
  selector:
    app: nifi
  ports:
    - port: 8443
      targetPort: 8443
      nodePort: 30443
      name: https
    - port: 10000
      targetPort: 10000
      nodePort: 30000
      name: site-to-site
