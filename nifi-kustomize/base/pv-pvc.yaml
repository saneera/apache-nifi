apiVersion: v1
kind: PersistentVolume
metadata:
  name: nifi-flowfiles-pv
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nifi/flowfiles
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nifi-content-pv
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  capacity:
    storage: 20Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nifi/content
---
apiVersion: v1
kind: PersistentVolume
