spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nifi/provenance
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nifi-database-pv
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nifi/database
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nifi-flowfiles-pvc
  namespace: inspire-silrelease
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
