apiVersion: v1
kind: ServiceAccount
metadata:
  name: nifi-cert-sa
  namespace: inspire-silrelease
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nifi-cert-role
  namespace: inspire-silrelease
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nifi-cert-rolebinding
  namespace: inspire-silrelease
  annotations:
    argocd.argoproj.io/sync-wave: "0"
subjects:
  - kind: ServiceAccount
    name: nifi-cert-sa
    namespace: inspire-silrelease
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: nifi-cert-role
