---
apiVersion: v1
kind: Namespace
metadata:
  name: openfire

---
# ── NON-SENSITIVE CONFIG ──────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: openfire-config
  namespace: openfire
data:
  MYSQL_HOST: "mysql"           # k8s Service name of the MySQL pod
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: "openfire"
  XMPP_DOMAIN: "example.com"   # ← YOUR XMPP domain
  XMPP_FQDN: "xmpp.example.com" # ← YOUR server FQDN
  LOG_DEBUG: "false"
  REST_API_ALLOWED_IPS: ""      # empty = all IPs allowed; e.g. "10.0.0.0/8"

---
# ── SENSITIVE VALUES ──────────────────────────────────────────────────────────
# Generate base64: echo -n 'yourvalue' | base64
apiVersion: v1
kind: Secret
metadata:
  name: openfire-secret
  namespace: openfire
type: Opaque
data:
  MYSQL_USER:       b3BlbmZpcmU=   # openfire   ← CHANGE
  MYSQL_PASSWORD:   b3BlbmZpcmU=   # openfire   ← CHANGE
  REST_API_SECRET:  Y2hhbmdlbWU=   # changeme   ← CHANGE
