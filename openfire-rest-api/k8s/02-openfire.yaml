---
# ── OPENFIRE DATA PVC ─────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openfire-data
  namespace: openfire
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard     # ← set your StorageClass
  resources:
    requests:
      storage: 5Gi

---
# ── OPENFIRE DEPLOYMENT ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfire
  namespace: openfire
  labels:
    app: openfire
    version: "5.0.4"
spec:
  replicas: 1          # Openfire is single-node without clustering plugin
  selector:
    matchLabels:
      app: openfire
  strategy:
    type: Recreate     # required: only one pod may own the PVC at a time
  template:
    metadata:
      labels:
        app: openfire
        version: "5.0.4"
    spec:
      terminationGracePeriodSeconds: 60

      # ── Init: wait for MySQL before starting Openfire ────────────────────
      initContainers:
        - name: wait-mysql
          image: busybox:1.36
          command:
            - sh
            - "-c"
            - |
              echo "Waiting for MySQL..."
              until nc -z mysql 3306 2>/dev/null; do sleep 3; done
              echo "MySQL ready."

      containers:
        - name: openfire
          # ── Replace with your actual registry image ──────────────────────
          image: ghcr.io/igniterealtime/openfire:v5.0.4
          # image: your.registry.io/openfire:5.0.4-plugins
          imagePullPolicy: Always

          ports:
            - name: xmpp-c2s
              containerPort: 5222
            - name: xmpp-c2s-ssl
              containerPort: 5223
            - name: xmpp-s2s
              containerPort: 5269
            - name: bosh-http
              containerPort: 7070
            - name: bosh-https
              containerPort: 7443
            - name: admin-http
              containerPort: 9090
            - name: admin-https
              containerPort: 9091

          # ── Env from ConfigMap (non-sensitive) ────────────────────────────
          envFrom:
            - configMapRef:
                name: openfire-config
            - secretRef:
                name: openfire-secret

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi

          volumeMounts:
            - name: openfire-data
              mountPath: /var/lib/openfire

          # ── Health checks ─────────────────────────────────────────────────
          # Openfire takes ~40-60 s to start on first boot (schema init).
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /index.jsp
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 10

      volumes:
        - name: openfire-data
          persistentVolumeClaim:
            claimName: openfire-data

---
# ═══════════════════════════════════════════════════════════════════════════════
# NODEPORT SERVICES
# NodePort range is 30000-32767.  Adjust nodePort values to fit your cluster.
# ═══════════════════════════════════════════════════════════════════════════════

# ── XMPP CLIENT (C2S) ─────────────────────────────────────────────────────────
# Used by XMPP clients (Spark, Conversations, etc.)
apiVersion: v1
kind: Service
metadata:
  name: openfire-xmpp-c2s
  namespace: openfire
  labels:
    app: openfire
spec:
  type: NodePort
  selector:
    app: openfire
  ports:
    - name: xmpp-c2s
      port: 5222
      targetPort: 5222
      nodePort: 30522        # ← adjust if clashes
    - name: xmpp-c2s-ssl
      port: 5223
      targetPort: 5223
      nodePort: 30523        # ← adjust if clashes

---
# ── XMPP SERVER-TO-SERVER (S2S) ──────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: openfire-xmpp-s2s
  namespace: openfire
  labels:
    app: openfire
spec:
  type: NodePort
  selector:
    app: openfire
  ports:
    - name: xmpp-s2s
      port: 5269
      targetPort: 5269
      nodePort: 30526        # ← adjust if clashes

---
# ── BOSH / HTTP BINDING ───────────────────────────────────────────────────────
# Used by web clients (Converse.js, etc.)
apiVersion: v1
kind: Service
metadata:
  name: openfire-bosh
  namespace: openfire
  labels:
    app: openfire
spec:
  type: NodePort
  selector:
    app: openfire
  ports:
    - name: bosh-http
      port: 7070
      targetPort: 7070
      nodePort: 30707        # ← adjust if clashes
    - name: bosh-https
      port: 7443
      targetPort: 7443
      nodePort: 30744        # ← adjust if clashes

---
# ── ADMIN CONSOLE + REST API ──────────────────────────────────────────────────
# Keep nodePort for admin off a "well-known" port to reduce exposure.
# REST API calls (from your backend) use the same port with the secret header.
apiVersion: v1
kind: Service
metadata:
  name: openfire-admin
  namespace: openfire
  labels:
    app: openfire
spec:
  type: NodePort
  selector:
    app: openfire
  ports:
    - name: admin-http
      port: 9090
      targetPort: 9090
      nodePort: 30909        # ← adjust if clashes
    - name: admin-https
      port: 9091
      targetPort: 9091
      nodePort: 30910        # ← adjust if clashes
