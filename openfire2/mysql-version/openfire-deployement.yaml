apiVersion: v1
kind: ConfigMap
metadata:
  name: openfire-config
data:
  openfire.xml: |
    <jive>
        <database>
            <defaultProvider>
                <driver>com.mysql.cj.jdbc.Driver</driver>
                <serverURL>jdbc:mysql://mysql:3306/openfire</serverURL>
                <username>openfire</username>
                <password>openfire123</password>
            </defaultProvider>
        </database>
        <xmpp>
           <domain>localhost</domain>
        </xmpp>
        <fqdn>openfire.dev1.fqdn</fqdn>
        <setup>true</setup>
    </jive>

  security.xml: |
    <?xml version="1.0" encoding="UTF-8"?>    
    <security>
      <encrypt>
        <algorithm>AES</algorithm>
        <key>c2VjcmV0S2V5MTIzNDU2</key>
      </encrypt>
    </security>

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openfire-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfire
  template:
    metadata:
      labels:
        app: openfire
    spec:
      securityContext:
        fsGroup: 1000

      initContainers:
        - name: init-container
          image: ghcr.io/igniterealtime/openfire:latest
          command:
            - sh
            - -c
            - |
              echo "Copying openfire.xml..."

              mkdir -p /data/conf

              # Copy ONLY if not exists (important)
              if [ ! -f /data/conf/openfire.xml ]; then
                cp /config/openfire.xml /data/conf/openfire.xml
              fi

              # Copy ONLY if not exists (important)
              if [ ! -f /data/conf/security.xml ]; then
                cp /config/security.xml /data/conf/security.xml
              fi
              
              
              # COPY SECURITY (THIS IS YOUR FIX)
              if [ ! -d /data/conf/security ]; then
                echo "Copying security_org..."
                cp -a /usr/local/openfire/resources/security_org /data/conf/security
                ls -l /data/conf/security
              fi
              
              
              echo "done."

          volumeMounts:
            - name: openfire-data
              mountPath: /data

            - name: openfire-config
              mountPath: /config

      containers:
        - name: openfire
          image: ghcr.io/igniterealtime/openfire:latest
          ports:
            - containerPort: 9090
            - containerPort: 5222
            - containerPort: 7070

          volumeMounts:
            - name: openfire-data
              mountPath: /var/lib/openfire

      volumes:

        - name: openfire-data
          persistentVolumeClaim:
            claimName: openfire-config-pvc

        - name: openfire-config
          configMap:
            name: openfire-config


---
apiVersion: v1
kind: Service
metadata:
  name: openfire
spec:
  type: ClusterIP
  selector:
    app: openfire
  ports:
    - name: admin
      port: 9090
      targetPort: 9090
    - name: xmpp
      port: 5222
      targetPort: 5222

