  - mysql-secret.yaml
  - mysql-deployment.yaml
  - mysql-service.yaml
  - openfire-deployment.yaml
  - openfire-service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: openfire
      app.kubernetes.io/component: xmpp-server
