apiVersion: apps/v1
kind: Deployment
metadata:
  name: openfire
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openfire
  template:
    metadata:
      labels:
        app: openfire
    spec:

      initContainers:
        - name: init-openfire
          image: your-dockerhub/openfire:latest
          command:
            - sh
            - -c
            - |
              echo "Initializing Openfire home..."

              # Create required dirs
              mkdir -p /data/conf
              mkdir -p /data/plugins
              mkdir -p /data/embedded-db

              # Copy default config if not exists
              if [ ! -f /data/conf/openfire.xml ]; then
                cp /config/openfire.xml /data/conf/openfire.xml
              fi

              # 🔥 IMPORTANT: copy default security.xml if missing
              if [ ! -f /data/conf/security.xml ]; then
                cp /opt/openfire/conf/security.xml /data/conf/security.xml
              fi

              # Copy plugins if empty
              if [ -z "$(ls -A /data/plugins)" ]; then
                cp -r /opt/openfire/plugins/* /data/plugins/
              fi

              # Fix permissions
              chown -R 1000:1000 /data
              chmod -R 775 /data

          volumeMounts:
            - name: openfire-data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        - name: openfire
          image: your-dockerhub/openfire:latest
          ports:
            - containerPort: 9090
            - containerPort: 9091
            - containerPort: 5222
            - containerPort: 7070

          env:
            - name: OPENFIRE_SYSTEM_PROPERTIES
              value: |
                plugin.restapi.enabled=true
                plugin.restapi.secret=secret123

          volumeMounts:
            - name: openfire-data
              mountPath: /var/lib/openfire

          readinessProbe:
            httpGet:
              path: /index.jsp
              port: 9090
            initialDelaySeconds: 40
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /index.jsp
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 20

      volumes:
        - name: openfire-data
          persistentVolumeClaim:
            claimName: openfire-pvc
